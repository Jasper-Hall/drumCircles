<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>drum-circles</title>
  <meta name="description" content="a euclidean groovebox for the browser — scale-locked, impossible to play a wrong note">
  <meta property="og:title" content="drum-circles">
  <meta property="og:description" content="a euclidean groovebox for the browser — scale-locked, impossible to play a wrong note">
  <meta name="theme-color" content="#050608">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050608'/%3E%3Ccircle cx='32' cy='13' r='3' fill='%2300FF88'/%3E%3Ccircle cx='45.4' cy='18.6' r='3' fill='%23545d6a'/%3E%3Ccircle cx='51' cy='32' r='3' fill='%23ece7da'/%3E%3Ccircle cx='45.4' cy='45.4' r='3' fill='%23545d6a'/%3E%3Ccircle cx='32' cy='51' r='3' fill='%23ece7da'/%3E%3Ccircle cx='18.6' cy='45.4' r='3' fill='%23545d6a'/%3E%3Ccircle cx='13' cy='32' r='3' fill='%23ece7da'/%3E%3Ccircle cx='18.6' cy='18.6' r='3' fill='%23545d6a'/%3E%3Ccircle cx='32' cy='23' r='2.5' fill='%2300D4FF'/%3E%3Ccircle cx='41' cy='32' r='2.5' fill='%23545d6a'/%3E%3Ccircle cx='32' cy='41' r='2.5' fill='%23545d6a'/%3E%3Ccircle cx='23' cy='32' r='2.5' fill='%23545d6a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public/styles.css">
</head>
<body>

  <header class="bar">
    <div class="bar-id">
      <span class="wordmark">drum-circles</span>
      <span class="tagline">euclidean groovebox</span>
    </div>
    <a class="return-link" href="https://rheome.tools/experiments/drum-circles">&larr; rheome.tools</a>
  </header>

  <div class="groovebox">

    <section class="transport" aria-label="transport">
      <button id="playButton">play</button>
      <label class="bpm">bpm
        <input type="number" id="bpmControl" value="120" min="60" max="200">
      </label>
    </section>

    <section class="fx" aria-label="effects">
      <div class="fx-group">
        <span class="fx-name">reverb</span>
        <label>mix <input type="range" id="reverbMix" min="0" max="1" step="0.01" value="0.3"><span class="value-display">0.30</span></label>
        <label>decay <input type="range" id="reverbDecay" min="0.1" max="10" step="0.1" value="4"><span class="value-display">4.00</span></label>
      </div>
      <div class="fx-group">
        <span class="fx-name">delay</span>
        <label>mix <input type="range" id="delayMix" min="0" max="1" step="0.01" value="0.3"><span class="value-display">0.30</span></label>
        <label>time <input type="range" id="delayTime" min="0" max="1" step="0.01" value="0.5"><span class="value-display">0.50</span></label>
        <label>feedback <input type="range" id="delayFeedback" min="0" max="0.9" step="0.01" value="0.4"><span class="value-display">0.40</span></label>
      </div>
    </section>

    <div class="tracks"></div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="public/groovebox.js"></script>
</body>
</html>
